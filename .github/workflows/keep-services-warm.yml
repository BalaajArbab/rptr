name: Keep services warm

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-services-warm
  cancel-in-progress: true

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Touch static web app
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$FRONTEND_URL/"

      - name: Touch API and MongoDB
        if: ${{ always() }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$API_URL/touch"
